# Render Blueprint for CipherShield.
#
# Deploys all three services in one shot:
#   - Managed PostgreSQL database
#   - Backend (Node/Express) as a web service
#   - AI microservice (FastAPI) as a web service
#   - Frontend (React/Vite) as a static site
#
# Cross-service URLs (backend -> AI service, backend -> frontend for CORS,
# frontend -> backend) are wired automatically using Render's `fromService`
# `property: host` + `.onrender.com`, following Render's own documented
# pattern for multi-service Blueprints - no manual "fill in the URL after
# first deploy" step needed. See render.com/docs/blueprint-spec for the
# full reference if you want to extend this.
#
# To deploy: push this repo to GitHub/GitLab, then in the Render
# dashboard choose New -> Blueprint and point it at the repo.
#
# Known limitations on Render's free tier (documented, not hidden):
#   - Free web services spin down after a period of inactivity and take
#     ~30-60s to wake back up on the next request - fine for a demo/resume
#     project, not for a always-on production service.
#   - Free web services have an EPHEMERAL filesystem: anything written to
#     disk (e.g. Secure Document Vault uploads in backend/vault_storage)
#     is lost on redeploy/restart. For real persistence, attach a paid
#     Render Disk to the backend service, or move vault storage to object
#     storage (S3/R2/etc).
#   - Free Postgres plans/limits change over time - check Render's current
#     pricing page before relying on this for anything long-lived.

databases:
  - name: ciphershield-db
    plan: free
    databaseName: ciphershield
    user: ciphershield

services:
  # --- AI microservice (FastAPI + scikit-learn) ---
  - type: web
    name: ciphershield-ai-service
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: "pip install -r requirements.txt && python app/train.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  # --- Backend (Node/Express + Sequelize + Socket.IO) ---
  - type: web
    name: ciphershield-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: "npm install"
    # CLIENT_URL / AI_SERVICE_URL are derived at boot from each service's
    # Render-assigned hostname (see envVars below), rather than hardcoded.
    startCommand: >
      AI_SERVICE_URL="https://$AI_SERVICE_HOST.onrender.com"
      CLIENT_URL="https://$FRONTEND_HOST.onrender.com"
      node src/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ciphershield-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "1d"
      - key: CASE_AUTO_CREATE_THRESHOLD
        value: "70"
      - key: BLOCK_THRESHOLD
        value: "85"
      - key: REVIEW_THRESHOLD
        value: "55"
      - key: AI_SERVICE_HOST
        fromService:
          type: web
          name: ciphershield-ai-service
          property: host
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: ciphershield-frontend
          property: host

  # --- Frontend (React/Vite static build) ---
  - type: web
    runtime: static
    name: ciphershield-frontend
    plan: free
    rootDir: frontend
    # Vite env vars are baked in at BUILD time, so the backend's URL has to
    # be resolved before `vite build` runs (same pattern Render's own docs
    # use for static sites that depend on another service's URL).
    buildCommand: >
      VITE_API_URL="https://$BACKEND_HOST.onrender.com/api"
      VITE_SOCKET_URL="https://$BACKEND_HOST.onrender.com"
      npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: ciphershield-backend
          property: host
    routes:
      # SPA fallback: React Router handles routing client-side.
      - type: rewrite
        source: /*
        destination: /index.html
